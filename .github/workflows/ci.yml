name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.9 is the oldest interpreter the stdlib code is checked against;
        # 3.12 matches a current Vercel Python runtime.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (ruff, dev-only tool; runtime stays stdlib)
        run: |
          python -m pip install ruff==0.13.3
          ruff check .
      - name: Byte-compile
        run: python -m py_compile harness/ask.py web/api-ask.py
      - name: Tests (all providers mocked, no secrets)
        run: python -m unittest discover -s tests -v
